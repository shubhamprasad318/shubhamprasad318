<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Shubham Prasad — Software Engineer, Full Stack and GenAI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b32b"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- soft orbs -->
  <circle cx="1040" cy="70" r="110" fill="#f7b32b" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="930" cy="250" r="90" fill="#ff6b6b" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="60" y="78" width="6" height="144" rx="3" fill="url(#accent)"/>

  <!-- name -->
  <text x="92" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">Shubham Prasad</text>

  <!-- role -->
  <text x="94" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#accent)">Software Engineer · Full Stack &amp; GenAI</text>

  <!-- tagline -->
  <text x="94" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#b8c1d9">LLM evaluation infra · SFT data pipelines · Voice &amp; multi-agent systems</text>

  <!-- right: terminal card -->
  <g transform="translate(770 68)">
    <rect width="370" height="164" rx="12" fill="#0a0e1c" stroke="#2b3556" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#febc2e"/>
    <circle cx="60" cy="20" r="6" fill="#28c840"/>
    <g font-family="Fira Code, Consolas, Menlo, monospace" font-size="15">
      <text x="20" y="58" fill="#7dd3fc">$</text>
      <text x="36" y="58" fill="#e5e7eb">whoami</text>
      <text x="20" y="84" fill="#a3e635">builder of LLM eval harnesses</text>
      <text x="20" y="108" fill="#a3e635">1,200+ images · 16 languages</text>
      <text x="20" y="132" fill="#a3e635">1,600+ users on EKS · solo</text>
      <text x="20" y="152" fill="#7dd3fc">$</text>
      <rect x="36" y="140" width="9" height="16" fill="#e5e7eb">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
